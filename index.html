<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contaminated water in Tshwane</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
html,body{margin:0;padding:0;background:#0d0d0d;overflow:hidden;width:100%;height:100%}
.tw-app,.tw-app *{box-sizing:border-box;margin:0;padding:0}
.tw-app{--red:#dd1f26;--charcoal:#0d0d0d;--white:#f0f0f0;--muted:#999;--card:#1a1a1a;--border:#2a2a2a;width:100%;height:100%;color:var(--white);background:var(--charcoal);font-family:'Proxima Nova','proxima-nova',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;position:relative;isolation:isolate;display:flex;flex-direction:column}
.tw-app .leaflet-container{background:#0d0d0d!important}
.tw-app .leaflet-tile-pane{filter:grayscale(1) invert(1) brightness(.8) contrast(.9)}

/* Compact header */
.tw-header{padding:14px 20px 10px;background:var(--charcoal);z-index:700;flex-shrink:0}
.tw-header h1{font-size:clamp(18px,3vw,28px);font-weight:800;color:var(--white);line-height:1.1;letter-spacing:-.01em;margin:0}
.tw-header p{font-size:clamp(10px,1.5vw,13px);color:var(--muted);margin-top:4px;line-height:1.3}

/* Body: map + sidebar */
.tw-body{display:flex;flex-direction:row;flex:1;min-height:0;position:relative}

/* Map fills available space */
.tw-map-wrap{flex:1;position:relative;min-height:0}
.tw-map-canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0}

/* Sidebar - desktop right panel */
.tw-sidebar{width:260px;flex-shrink:0;overflow-y:auto;padding:12px 14px 16px;background:var(--charcoal);border-left:1px solid var(--border);z-index:600}
.tw-sidebar h2{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.tw-area-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;cursor:pointer;transition:background .2s}
.tw-area-item:hover{background:rgba(255,255,255,.05)}
.tw-area-dot{flex-shrink:0;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px rgba(221,31,38,.2)}
.tw-area-name{font-size:12px;color:#ccc;font-weight:500;line-height:1.3}

/* Map overlays */
.tw-instruction{position:absolute;top:10px;right:10px;z-index:500;pointer-events:none}
.tw-instruction span{display:inline-block;font-size:10px;color:var(--muted);background:rgba(13,13,13,.8);border:1px solid var(--border);border-radius:5px;padding:4px 8px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.tw-credits{position:absolute;bottom:10px;left:10px;z-index:500;pointer-events:none}
.tw-credits p{font-size:10px;color:var(--muted);line-height:1.4;margin:0;text-shadow:0 1px 6px rgba(0,0,0,.9)}
.tw-credits strong{color:#bbb;font-weight:600}

/* Markers */
.tw-marker{display:flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:var(--red);border:2px solid rgba(255,255,255,.15);box-shadow:0 0 8px rgba(221,31,38,.5);transition:transform .2s}
.tw-marker:hover{transform:scale(1.4);z-index:1000}
.tw-marker.active{transform:scale(1.4);box-shadow:0 0 12px rgba(221,31,38,.8)}

/* Tooltips (on click only) */
.tw-app .leaflet-tooltip{background:rgba(13,13,13,.85);border:1px solid var(--border);border-radius:5px;color:#ddd;font-size:11px;font-weight:600;padding:3px 8px;box-shadow:0 2px 8px rgba(0,0,0,.5);white-space:nowrap;pointer-events:none}
.tw-app .leaflet-tooltip-top:before{border-top-color:rgba(13,13,13,.85)}
.tw-app .leaflet-tooltip-bottom:before{border-bottom-color:rgba(13,13,13,.85)}

/* Popups */
.tw-app .leaflet-popup-content-wrapper{background:var(--card);color:var(--white);border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 24px rgba(0,0,0,.6)}
.tw-app .leaflet-popup-content{margin:12px 14px;font-size:13px;line-height:1.5;min-width:160px}
.tw-app .leaflet-popup-tip{background:var(--card);border:1px solid var(--border)}
.tw-app .leaflet-popup-close-button{color:var(--muted);font-size:18px;padding:6px 8px}
.tw-popup-title{font-size:14px;font-weight:700;color:var(--white)}
.tw-popup-sub{font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.04em}

/* Zoom + attribution */
.tw-app .leaflet-bar a{background:var(--card);color:var(--white);border-color:var(--border)}
.tw-app .leaflet-bar a:hover{background:#2a2a2a;color:var(--white)}
.tw-app .leaflet-control-attribution{background:rgba(13,13,13,.7);color:#555;font-size:9px;border-radius:4px 0 0 0}
.tw-app .leaflet-control-attribution a{color:#777}
.tw-app .leaflet-top{bottom:40px;right:10px;left:auto}
.tw-app .leaflet-top .leaflet-bar{border:none;box-shadow:0 2px 8px rgba(0,0,0,.5)}

.tw-sidebar::-webkit-scrollbar{width:4px}
.tw-sidebar::-webkit-scrollbar-track{background:transparent}
.tw-sidebar::-webkit-scrollbar-thumb{background:#333;border-radius:3px}

/* Mobile: horizontal scroll area strip at bottom */
@media(max-width:767px){
.tw-app{height:100%;display:flex;flex-direction:column}
.tw-header{padding:12px 16px 8px;flex-shrink:0}
.tw-body{flex-direction:column}
.tw-map-wrap{flex:1;min-height:0;position:relative}
.tw-map-canvas{position:absolute;top:0;left:0;width:100%;height:100%}
/* Horizontal scrolling area pills */
.tw-sidebar{width:100%;flex-shrink:0;height:160px;max-height:160px;overflow-y:auto;overflow-x:hidden;border-left:none;border-top:1px solid var(--border);padding:10px 14px 12px;-webkit-overflow-scrolling:touch}
.tw-sidebar h2{margin-bottom:8px;padding-bottom:6px}
.tw-area-list{display:block;gap:0;flex-wrap:nowrap;overflow:visible;padding-bottom:0}
.tw-area-item{flex-shrink:0;white-space:normal;padding:7px 10px;border-radius:5px;border:none;background:transparent;display:flex;align-items:center;gap:8px}
.tw-area-item+.tw-area-item{border-top:1px solid rgba(255,255,255,.04)}
.tw-area-dot{width:7px;height:7px}
.tw-area-name{font-size:12px}
.tw-credits{bottom:8px;left:10px}
.tw-instruction{top:8px;right:10px}
}
</style>
</head>
<body>
<div class="tw-app">
<div class="tw-header">
<h1>Contaminated water in Tshwane</h1>
<p>Areas affected, according to the City of Tshwane</p>
</div>
<div class="tw-body">
<div class="tw-map-wrap">
<div id="tw-map" class="tw-map-canvas"></div>
<div class="tw-instruction"><span>Tap a marker or area name for details</span></div>
<div class="tw-credits"><p>Source: City of Tshwane<br><strong>Graphic: Mihle Mdashe/News24</strong></p></div>
</div>
<div class="tw-sidebar">
<h2>Affected areas</h2>
<div id="tw-area-list" class="tw-area-list"></div>
</div>
</div>
</div>
<script>
(function(){
'use strict';
var areas=[
{name:"Arcadia",lat:-25.7452658,lng:28.2029523},
{name:"Asiatic Bazaar (Marabastad)",lat:-25.7394229,lng:28.1758982},
{name:"Asiatic Bazaar Extension 1",lat:-25.7418792,lng:28.1705734},
{name:"Belle Ombre 636-JR",lat:-25.7430000,lng:28.1685000},
{name:"Cape Boys' Location",lat:-25.7410000,lng:28.1720000},
{name:"Daspoort 319-JR",lat:-25.7364467,lng:28.1868666},
{name:"Elandspoort 357-JR",lat:-25.7549467,lng:28.2278091},
{name:"Phillip Nel Park",lat:-25.7380929,lng:28.1418503},
{name:"Pretoria",lat:-25.7565723,lng:28.1913815},
{name:"Pretoria Central",lat:-25.7493819,lng:28.1883188},
{name:"Pretoria Extension 1",lat:-25.7473786,lng:28.0750159},
{name:"Pretoria Extension 9",lat:-25.7867891,lng:28.2769363},
{name:"Pretoria Extension 11",lat:-25.7350483,lng:28.1797354},
{name:"Pretoria Extension 14",lat:-25.8048000,lng:28.1678638},
{name:"Prinshof",lat:-25.7379200,lng:28.1939180},
{name:"Sunnyside",lat:-25.7534891,lng:28.2078956},
{name:"Trevenna",lat:-25.7501604,lng:28.2022212}
];
var map,markers=[];
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function init(){
var mapEl=document.getElementById('tw-map');
map=L.map('tw-map',{zoomControl:true,attributionControl:true,scrollWheelZoom:true,dragging:true,doubleClickZoom:true,touchZoom:true,minZoom:10,maxZoom:18});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap',maxZoom:19,referrerPolicy:'strict-origin-when-cross-origin'}).addTo(map);
var bounds=L.latLngBounds([]);
areas.forEach(function(a,i){
var icon=L.divIcon({className:'',html:'<div class="tw-marker" data-idx="'+i+'"></div>',iconSize:[14,14],iconAnchor:[7,7],popupAnchor:[0,-10]});
var marker=L.marker([a.lat,a.lng],{icon:icon})
.bindTooltip(a.name,{direction:'top',offset:[0,-8],opacity:.9})
.bindPopup('<div class="tw-popup-title">'+esc(a.name)+'</div><div class="tw-popup-sub">Affected area</div>',{maxWidth:260,closeButton:true,autoPan:true})
.addTo(map);
markers.push(marker);
bounds.extend([a.lat,a.lng]);
marker.on('popupopen',function(){var el=marker.getElement();if(el){var m=el.querySelector('.tw-marker');if(m)m.classList.add('active');}});
marker.on('popupclose',function(){var el=marker.getElement();if(el){var m=el.querySelector('.tw-marker');if(m)m.classList.remove('active');}});
});
map.fitBounds(bounds,{padding:[40,40],maxZoom:14});
/* Show tooltip when popup opens */
markers.forEach(function(mk,i){
mk.on('popupopen',function(){mk.openTooltip();});
mk.on('popupclose',function(){mk.closeTooltip();});
});
/* Build area list */
var listEl=document.getElementById('tw-area-list');
areas.forEach(function(a,i){
var row=document.createElement('div');
row.className='tw-area-item';
row.innerHTML='<div class="tw-area-dot"></div><div class="tw-area-name">'+esc(a.name)+'</div>';
row.addEventListener('click',function(){
map.flyTo([a.lat,a.lng],15,{duration:.6});
markers[i].openPopup();
});
listEl.appendChild(row);
});
/* Fix sizing */
function fixSize(){map.invalidateSize(false);}
setTimeout(fixSize,100);
setTimeout(fixSize,300);
setTimeout(fixSize,600);
setTimeout(fixSize,1000);
window.addEventListener('load',fixSize);
window.addEventListener('resize',function(){setTimeout(fixSize,100);});
window.addEventListener('orientationchange',function(){setTimeout(fixSize,200);setTimeout(fixSize,500);});
if(window.ResizeObserver&&mapEl){var ro=new ResizeObserver(function(){fixSize();});ro.observe(mapEl);}
}
if(document.readyState!=='loading'){init();}else{document.addEventListener('DOMContentLoaded',init);}
})();
</script>
</body>
</html>
